spring.application.name=lab3-api-gateway
server.port=3000

# URLs base de los microservicios: obligatorias por variable de entorno, sin valor
# por defecto (en local se puede usar el perfil "local", ver application-local.properties)
modulos.estudiantes.url=${ESTUDIANTES_URL}
modulos.materias.url=${MATERIAS_URL}
modulos.inscripciones.url=${INSCRIPCIONES_URL}
modulos.autenticacion.url=${AUTENTICACION_URL}

# JWT: el secreto se inyecta solo por variable de entorno (sin valor por defecto).
# Debe ser el mismo JWT_SECRET con el que firma el módulo de Autenticación.
jwt.secreto=${JWT_SECRET}

# CORS: origen del frontend, obligatorio por variable de entorno (sin valor por defecto).
# Varios orígenes separados por coma, p. ej. FRONTEND_URL=http://localhost:4200,https://app.midominio.com
cors.allowed-origins=${FRONTEND_URL}

# El Gateway no procesa multipart: lo reenvía intacto (con sus límites de 2 MB / 10 MB
# aplicados por Estudiantes y Materias). Si Spring lo parseara, consumiría el cuerpo
# y aplicaría su propio límite de 1 MB.
spring.servlet.multipart.enabled=false

# Actuator: solo el endpoint de salud, sin detalles internos
management.endpoints.web.exposure.include=health
management.endpoint.health.show-details=never

logging.level.root=INFO
logging.pattern.console=%d{yyyy-MM-dd HH:mm:ss} %5p [%t] %c - %m%n
